<div
  class="modal d-block"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="edit-profile-modal-title"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg glassy">
      <div class="modal-header">
        <h2 id="edit-profile-modal-title" class="modal-title fs-5 fw-bold">
          Edit Profile
        </h2>
        <button type="button" class="btn-close" aria-label="Close" (click)="onClose()"></button>
      </div>

      <form (ngSubmit)="onEditGift()">
        <div class="modal-body">
          <div class="mb-3">
            <label for="name" class="form-label fw-bold">Name</label>
            <input
              id="name"
              type="text"
              name="name"
              class="form-control"
              [(ngModel)]="giftData.name"
              required
            />
          </div>

          <div class="mb-3">
            <label for="brand" class="form-label fw-bold">Brand</label>
            <input
              id="brand"
              type="text"
              name="brand"
              class="form-control"
              [(ngModel)]="giftData.brand"
              required
            />
          </div>

          <div class="mb-3">
            <label for="price" class="form-label fw-bold">Price</label>
            <input
              id="price"
              type="number"
              name="price"
              class="form-control"
              [(ngModel)]="giftData.price"
            />
          </div>

          <div class="mb-3">
            <label for="photo" class="form-label fw-bold">
              Photo
            </label>

            <input
              id="photo"
              type="url"
              name="photo"
              class="form-control"
              [(ngModel)]="giftData.photo"
            />
          </div>

          <div class="mb-3">
            <label for="url" class="form-label fw-bold">
              URL
            </label>

            <input
              id="url"
              type="url"
              name="url"
              class="form-control"
              [(ngModel)]="giftData.url"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="onClose()"
            [disabled]="isSubmitting"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-glassy-success"
            [disabled]="isSubmitting"
          >
            {{ isSubmitting ? 'Saving...' : 'Save Changes' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div
  class="modal-backdrop fade show"
  (click)="onClose()"
></div>
