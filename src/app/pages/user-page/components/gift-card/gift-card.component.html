<div
  class="card glassy rounded-2 h-100 gift-card"
  [class.gift-card--expanded]="expanded()"
>
  <div class="card-body p-3 p-md-4 position-relative h-100">

    <div
      class="gift-card__content"
      [class.gift-card__content--expanded]="expanded()"
    >
      <div class="gift-card__image">
        @if (gift().photo) {
          <img
            [src]="gift().photo"
            [alt]="'Photo of ' + gift().name"
            class="gift-photo rounded-3"
          />
        } @else {
          <div
            class="gift-photo rounded-3 bg-light
                   d-flex align-items-center justify-content-center"
          >
            <span class="display-5 text-secondary">
              {{ gift().name.charAt(0).toUpperCase() }}
            </span>
          </div>
        }
      </div>

      @if (expanded()) {
        <div class="gift-card__details d-flex flex-column">
          <h2 class="h5 fw-bold mb-1">
            {{ gift().name }}
          </h2>

          <p class="text-body-secondary mb-2">
            {{ gift().brand }}
          </p>

          <p class="h5 fw-bold mb-3">
            {{ gift().price }}€
          </p>

          <a
            [href]="gift().url"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-outline-warning btn-sm align-self-start"
            (click)="$event.stopPropagation()"
          >
            View gift
            <i class="bi bi-box-arrow-up-right ms-1"></i>
          </a>
        </div>
      } @else {
        <h2 class="h5 fw-bold mb-0 mt-auto d-flex align-items-center">
          {{ gift().price }}€
        </h2>
      }
    </div>

    @if(expanded() && routeId != null && +routeId === authService.currentUser()?.id) {
      <button
        type="button"
        class="btn rounded-circle position-absolute bottom-0 end-0 my-3 me-5"
        (click)="deleteGift(gift().id)"
      >
        <i class="bi bi-trash"></i>
      </button>
    }

    <button
      type="button"
      class="btn rounded-circle position-absolute bottom-0 end-0 my-3 me-2"
      [attr.aria-label]="expanded() ? 'Close gift details' : 'Open gift details'"
      (click)="toggleExpanded.emit()"
    >
    <i
      class="bi"
      [class.bi-chevron-right]="!expanded()"
      [class.bi-chevron-left]="expanded()"
    ></i>
    </button>

  </div>
</div>
