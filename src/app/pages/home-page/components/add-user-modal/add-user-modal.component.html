<div
  class="modal d-block"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-user-modal-title"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg glassy">
      <div class="modal-header">
        <h2 id="add-user-modal-title" class="modal-title fs-5 fw-bold">
          Add new user
        </h2>

        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="closeUserModal()"
          [disabled]="isSubmitting"
        ></button>
      </div>

      <form (ngSubmit)="addUser()">
        <div class="modal-body">
          <div class="mb-3">
            <label for="name" class="form-label fw-bold">Name</label>
            <input
              id="name"
              type="text"
              name="name"
              class="form-control"
              [(ngModel)]="newUser.name"
              required
            />
          </div>

          <div class="mb-3">
            <label for="surname" class="form-label fw-bold">Surname</label>
            <input
              id="surname"
              type="text"
              name="surname"
              class="form-control"
              [(ngModel)]="newUser.surname"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-bold">Password</label>
            <input
              id="password"
              type="password"
              name="password"
              class="form-control"
              [(ngModel)]="newUser.password"
              required
            />
          </div>

          <div class="mb-3">
            <label for="avatar" class="form-label fw-bold">
              Avatar URL <span class="text-body-secondary">(optional)</span>
            </label>

            <input
              id="avatar"
              type="url"
              name="avatar"
              class="form-control"
              [(ngModel)]="newUser.avatar"
              placeholder="https://example.com/avatar.jpg"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-glassy-danger"
            (click)="closeUserModal()"
            [disabled]="isSubmitting"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-glassy-success"
            [disabled]="isSubmitting"
          >
            {{ isSubmitting ? 'Adding...' : 'Add user' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div
  class="modal-backdrop fade show"
  (click)="closeUserModal()"
></div>
