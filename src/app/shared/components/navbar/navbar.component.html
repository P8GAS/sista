<div class="container fixed-bottom mb-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-6">

      <nav class="bottom-actions position-relative rounded-pill glassy">
        <div class="row h-100 align-items-center text-center">

          <div class="col-3">
            <button
              type="button"
              class="btn btn-success rounded-pill w-50"
              (click)="goBack()"
            >
              <i class="bi bi-arrow-left fs-4"></i>
            </button>
          </div>

          <div class="col-2">
            <button
              type="button"
              class="btn btn-success rounded-pill w-100"
              (click)="logout()"
            >
              <i class="bi bi-box-arrow-left fs-4"></i>
            </button>
          </div>

          <div class="col-2"></div>

          <div class="col-2">
            <button
              type="button"
              class="btn btn-success rounded-pill w-100"
              (click)="goToGift()"
            >
              <i class="bi bi-gift fs-4"></i>
            </button>
          </div>

          <div class="col-3">
            <button
              type="button"
              class="btn btn-success rounded-pill w-50"
              (click)="openProfile()"
            >
              <i class="bi bi-person-fill-gear fs-4"></i>
            </button>
          </div>


        </div>

        <div
          class="bottom-actions__center position-absolute
                 top-50 start-50 translate-middle
                 rounded-circle d-flex align-items-center justify-content-center glassy"
        >
          <button
            type="button"
            class="btn btn-success rounded-circle
                   d-flex align-items-center justify-content-center
                   w-100 h-100 border-0"
            (click)="middleLinkClicked()"
          >
            <i class="bi bi-plus-lg text-white"></i>
          </button>
        </div>

      </nav>

    </div>
  </div>
</div>
